server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Bring in the full default MIME map, then add modern formats Astro emits.
  include /etc/nginx/mime.types;
  types {
    image/avif                avif;
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;

  # Long cache for fingerprinted assets, no cache for HTML
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Astro emits each route as <slug>/index.html — serve folder requests cleanly
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }

  # Custom 404 from the built site
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Hide server header
  server_tokens off;
}
